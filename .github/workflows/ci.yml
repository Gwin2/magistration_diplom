name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Unit tests and coverage
        run: |
          mkdir -p test-results
          python -m pytest \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results/junit.xml

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results
          path: |
            coverage.xml
            test-results/junit.xml
          if-no-files-found: ignore

  frontend-and-config:
    name: UI and infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Check UI syntax
        run: node --check ui/app.js

      - name: Check Python bytecode compilation
        run: python -m compileall -q src tests

      - name: Validate YAML files
        run: python -B scripts/ci/validate_yaml.py

      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/base > "$RUNNER_TEMP/k8s-rendered.yaml"

      - name: Install kubeconform
        run: |
          curl -fsSL \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"

      - name: Validate Kubernetes manifests
        run: |
          "$RUNNER_TEMP/kubeconform" -strict -summary "$RUNNER_TEMP/k8s-rendered.yaml"

  diagnostics:
    name: Advisory diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Collect format, type and dependency diagnostics
        run: |
          mkdir -p diagnostics
          set +e

          python -m ruff format --check src tests > diagnostics/ruff-format.txt 2>&1
          format_status=$?

          python -m mypy src --ignore-missing-imports > diagnostics/mypy.txt 2>&1
          mypy_status=$?

          python -m pip_audit --format json --output diagnostics/pip-audit.json
          audit_status=$?

          {
            echo "ruff_format_status=$format_status"
            echo "mypy_status=$mypy_status"
            echo "pip_audit_status=$audit_status"
          } > diagnostics/summary.txt

          exit 0

      - name: Upload advisory diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: advisory-diagnostics
          path: diagnostics/
          if-no-files-found: warn

  security:
    name: Filesystem security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
